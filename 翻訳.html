<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>翻訳アプリ</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap");

  :root {
    color-scheme: dark;
    --bg: #080711;
    --panel: rgba(17, 15, 32, .94);
    --panel-light: #17142b;
    --line: rgba(0, 245, 255, .32);
    --cyan: #00f5ff;
    --pink: #ff2bd6;
    --lime: #c8ff00;
    --text: #edfaff;
    --muted: #9a9ab5;
    --danger: #ff5577;
    font-family: "Noto Sans JP", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 38px 16px;
    color: var(--text);
    background:
      linear-gradient(rgba(0, 245, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 245, 255, .045) 1px, transparent 1px),
      radial-gradient(ellipse at 15% 0%, #24104a 0%, transparent 38%),
      radial-gradient(ellipse at 100% 90%, #102849 0%, transparent 40%),
      var(--bg);
    background-size: 34px 34px, 34px 34px, auto, auto, auto;
  }

  body::before {
    position: fixed;
    z-index: 5;
    inset: 0;
    pointer-events: none;
    content: "";
    opacity: .13;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(255, 255, 255, .12) 4px
    );
  }

  main {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    padding: 30px;
    overflow: visible;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow:
      0 0 25px rgba(0, 245, 255, .09),
      0 0 70px rgba(255, 43, 214, .08),
      inset 0 0 30px rgba(0, 245, 255, .025);
  }

  main::before,
  main::after {
    position: absolute;
    width: 34px;
    height: 34px;
    content: "";
    pointer-events: none;
  }

  main::before {
    top: -1px;
    left: -1px;
    border-top: 3px solid var(--pink);
    border-left: 3px solid var(--pink);
  }

  main::after {
    right: -1px;
    bottom: -1px;
    border-right: 3px solid var(--cyan);
    border-bottom: 3px solid var(--cyan);
  }

  h1 {
    margin: 0 0 8px;
    color: var(--cyan);
    font-family: "Orbitron", "Noto Sans JP", sans-serif;
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    letter-spacing: .08em;
    text-shadow: 0 0 12px rgba(0, 245, 255, .65);
  }

  h1::before {
    content: "◈ ";
    color: var(--pink);
    text-shadow: 0 0 12px var(--pink);
  }

  .note,
  .subtext {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: .92rem;
  }

  .languages {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
  }

  .picker {
    position: relative;
    width: min(340px, 42vw);
  }

  button,
  input,
  textarea {
    font: inherit;
  }

  button {
    cursor: pointer;
    padding: 11px 15px;
    color: #071015;
    background: var(--cyan);
    border: 1px solid var(--cyan);
    border-radius: 3px;
    font-weight: 700;
    transition: .18s ease;
    box-shadow: 0 0 12px rgba(0, 245, 255, .22);
  }

  button:hover {
    color: #fff;
    background: #00b9c5;
    box-shadow: 0 0 20px rgba(0, 245, 255, .48);
    transform: translateY(-1px);
  }

  button:disabled {
    cursor: wait;
    opacity: .55;
    transform: none;
  }

  .plain-button {
    color: var(--text);
    background: #211b37;
    border-color: rgba(255, 43, 214, .58);
    box-shadow: 0 0 12px rgba(255, 43, 214, .12);
  }

  .plain-button:hover {
    color: #fff;
    background: #3a2050;
    border-color: var(--pink);
    box-shadow: 0 0 18px rgba(255, 43, 214, .38);
  }

  .lang-button {
    width: 100%;
    overflow: hidden;
    color: var(--text);
    background: var(--panel-light);
    border: 1px solid var(--line);
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
    box-shadow: inset 0 0 12px rgba(0, 245, 255, .04);
  }

  .lang-button:hover {
    color: var(--cyan);
    background: #201d39;
    border-color: var(--cyan);
  }

  .menu {
    position: absolute;
    z-index: 10;
    top: calc(100% + 6px);
    right: 0;
    left: 0;
    padding: 9px;
    background: #100e20;
    border: 1px solid var(--cyan);
    border-radius: 3px;
    box-shadow: 0 0 22px rgba(0, 245, 255, .2);
  }

  .menu[hidden] { display: none; }

  .search {
    width: 100%;
    margin-bottom: 7px;
    padding: 10px;
    color: var(--text);
    background: #080711;
    border: 1px solid rgba(0, 245, 255, .4);
    border-radius: 2px;
    outline: none;
  }

  .search:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0, 245, 255, .25);
  }

  .search::placeholder,
  textarea::placeholder {
    color: #77758f;
  }

  .options {
    max-height: 230px;
    overflow-y: auto;
  }

  .option {
    display: block;
    width: 100%;
    padding: 9px 10px;
    color: var(--text);
    background: transparent;
    border: 0;
    border-radius: 2px;
    box-shadow: none;
    text-align: left;
    font-weight: 400;
  }

  .option:hover {
    color: var(--cyan);
    background: rgba(0, 245, 255, .1);
    box-shadow: inset 3px 0 var(--pink);
    transform: none;
  }

  .text-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: var(--cyan);
    font-family: "Orbitron", "Noto Sans JP", sans-serif;
    font-size: .88rem;
    letter-spacing: .03em;
  }

  textarea {
    width: 100%;
    min-height: 195px;
    padding: 13px;
    resize: vertical;
    color: var(--text);
    background:
      linear-gradient(rgba(0, 245, 255, .025), rgba(0, 245, 255, .025)),
      #0b0a15;
    border: 1px solid rgba(0, 245, 255, .28);
    border-radius: 3px;
    outline: none;
    line-height: 1.65;
    box-shadow: inset 0 0 16px rgba(0, 0, 0, .35);
  }

  textarea:focus {
    border-color: var(--cyan);
    box-shadow:
      0 0 14px rgba(0, 245, 255, .12),
      inset 0 0 16px rgba(0, 0, 0, .35);
  }

  textarea[readonly] {
    border-color: rgba(255, 43, 214, .38);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 20px 0 12px;
  }

  #status {
    min-height: 1.5em;
    color: var(--lime);
    text-align: center;
    font-size: .92rem;
    text-shadow: 0 0 8px rgba(200, 255, 0, .3);
  }

  #status.error {
    color: var(--danger);
    text-shadow: 0 0 8px rgba(255, 85, 119, .35);
  }

  @media (max-width: 600px) {
    body { padding: 18px 10px; }
    main { padding: 22px 15px; }
    .languages { flex-wrap: wrap; }
    .picker { width: 100%; }
    .text-grid { grid-template-columns: 1fr; }
    .actions button { flex: 1 1 42%; }
  }
</style>
</head>
<body>
<main>
  <h1>翻訳アプリ</h1>
  <p class="note">
    APIキー不要。無料翻訳サービスを利用します。文章は外部サービスに送信されます。
  </p>

  <div class="languages">
    <div class="picker" id="sourcePicker"></div>
    <button id="swapButton" class="plain-button" type="button"
            aria-label="言語を入れ替え" title="言語を入れ替え">⇄</button>
    <div class="picker" id="targetPicker"></div>
  </div>

  <div class="text-grid">
    <div>
      <label for="sourceText">翻訳するテキスト（500文字まで）</label>
      <textarea id="sourceText" maxlength="500" placeholder="ここに文章を入力"></textarea>
    </div>
    <div>
      <label for="resultText">翻訳結果</label>
      <textarea id="resultText" readonly placeholder="翻訳結果がここに表示されます"></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="translateButton" type="button">翻訳</button>
    <button id="copyButton" class="plain-button" type="button">結果をコピー</button>
    <button id="speakButton" class="plain-button" type="button">読み上げ</button>
    <button id="stopButton" class="plain-button" type="button">読み上げ停止</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
  // 利用できる言語や言語ペアは翻訳サービス側の対応状況によります。
  const languages = [
    { code: "ar", name: "アラビア語" },
    { code: "bg", name: "ブルガリア語" },
    { code: "bn", name: "ベンガル語" },
    { code: "ca", name: "カタルーニャ語" },
    { code: "cs", name: "チェコ語" },
    { code: "da", name: "デンマーク語" },
    { code: "de", name: "ドイツ語" },
    { code: "el", name: "ギリシャ語" },
    { code: "en", name: "英語" },
    { code: "es", name: "スペイン語" },
    { code: "et", name: "エストニア語" },
    { code: "fa", name: "ペルシャ語" },
    { code: "fi", name: "フィンランド語" },
    { code: "fr", name: "フランス語" },
    { code: "he", name: "ヘブライ語" },
    { code: "hi", name: "ヒンディー語" },
    { code: "hr", name: "クロアチア語" },
    { code: "hu", name: "ハンガリー語" },
    { code: "id", name: "インドネシア語" },
    { code: "it", name: "イタリア語" },
    { code: "ja", name: "日本語" },
    { code: "ko", name: "韓国語" },
    { code: "lt", name: "リトアニア語" },
    { code: "lv", name: "ラトビア語" },
    { code: "ms", name: "マレー語" },
    { code: "nl", name: "オランダ語" },
    { code: "no", name: "ノルウェー語" },
    { code: "pl", name: "ポーランド語" },
    { code: "pt", name: "ポルトガル語" },
    { code: "ro", name: "ルーマニア語" },
    { code: "ru", name: "ロシア語" },
    { code: "sk", name: "スロバキア語" },
    { code: "sl", name: "スロベニア語" },
    { code: "sq", name: "アルバニア語" },
    { code: "sr", name: "セルビア語" },
    { code: "sv", name: "スウェーデン語" },
    { code: "th", name: "タイ語" },
    { code: "tr", name: "トルコ語" },
    { code: "uk", name: "ウクライナ語" },
    { code: "ur", name: "ウルドゥー語" },
    { code: "vi", name: "ベトナム語" },
    { code: "zh-CN", name: "中国語（簡体字）" },
    { code: "zh-TW", name: "中国語（繁体字）" }
  ];

  let sourceCode = "ja";
  let targetCode = "en";

  const sourceText = document.getElementById("sourceText");
  const resultText = document.getElementById("resultText");
  const status = document.getElementById("status");
  const translateButton = document.getElementById("translateButton");

  function showStatus(message, error = false) {
    status.textContent = message;
    status.classList.toggle("error", error);
  }

  function makePicker(elementId, type, initialCode) {
    const root = document.getElementById(elementId);
    root.innerHTML = `
      <button type="button" class="lang-button" aria-expanded="false"></button>
      <div class="menu" hidden>
        <input class="search" type="search" placeholder="言語を検索">
        <div class="options"></div>
      </div>`;

    const button = root.querySelector(".lang-button");
    const menu = root.querySelector(".menu");
    const search = root.querySelector(".search");
    const options = root.querySelector(".options");

    function currentCode() {
      return type === "source" ? sourceCode : targetCode;
    }

    function setCode(code) {
      if (type === "source") sourceCode = code;
      else targetCode = code;

      const lang = languages.find(item => item.code === code);
      button.textContent = lang ? `${lang.name} (${lang.code})` : code;
      menu.hidden = true;
      button.setAttribute("aria-expanded", "false");
    }

    function renderOptions(query = "") {
      const q = query.trim().toLocaleLowerCase();
      options.replaceChildren();

      const found = languages.filter(lang =>
        `${lang.name} ${lang.code}`.toLocaleLowerCase().includes(q)
      );

      if (!found.length) {
        options.textContent = "該当する言語がありません";
        return;
      }

      found.forEach(lang => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "option";
        item.textContent = `${lang.name} (${lang.code})`;
        item.addEventListener("click", () => setCode(lang.code));
        options.appendChild(item);
      });
    }

    button.addEventListener("click", () => {
      menu.hidden = !menu.hidden;
      button.setAttribute("aria-expanded", String(!menu.hidden));
      if (!menu.hidden) {
        search.value = "";
        renderOptions();
        search.focus();
      }
    });

    search.addEventListener("input", () => renderOptions(search.value));

    document.addEventListener("click", event => {
      if (!root.contains(event.target)) {
        menu.hidden = true;
        button.setAttribute("aria-expanded", "false");
      }
    });

    setCode(initialCode);
    return { setCode };
  }

  const sourcePicker = makePicker("sourcePicker", "source", "ja");
  const targetPicker = makePicker("targetPicker", "target", "en");

  translateButton.addEventListener("click", async () => {
    const text = sourceText.value.trim();
    if (!text) {
      showStatus("翻訳する文章を入力してください。", true);
      return;
    }

    translateButton.disabled = true;
    showStatus("翻訳中…");

    try {
      const params = new URLSearchParams({
        q: text,
        langpair: `${sourceCode}|${targetCode}`
      });

      const response = await fetch(
        `https://api.mymemory.translated.net/get?${params.toString()}`
      );
      if (!response.ok) throw new Error("翻訳サービスに接続できませんでした。");

      const data = await response.json();
      if (data.responseStatus !== 200) {
        throw new Error(data.responseDetails || "翻訳できませんでした。");
      }

      // APIから返るHTMLエンティティを文字に戻す
      const decoder = document.createElement("textarea");
      decoder.innerHTML = data.responseData.translatedText || "";
      resultText.value = decoder.value;
      showStatus("翻訳が完了しました。");
    } catch (error) {
      showStatus(`翻訳に失敗しました: ${error.message}`, true);
    } finally {
      translateButton.disabled = false;
    }
  });

  document.getElementById("swapButton").addEventListener("click", () => {
    const oldSource = sourceCode;
    sourcePicker.setCode(targetCode);
    targetPicker.setCode(oldSource);

    // 翻訳結果があれば、入力欄と結果欄も入れ替える
    if (resultText.value) {
      const oldText = sourceText.value;
      sourceText.value = resultText.value;
      resultText.value = oldText;
    }
    showStatus("");
  });

  document.getElementById("copyButton").addEventListener("click", async () => {
    if (!resultText.value) {
      showStatus("コピーする翻訳結果がありません。", true);
      return;
    }
    try {
      await navigator.clipboard.writeText(resultText.value);
      showStatus("翻訳結果をコピーしました。");
    } catch {
      resultText.focus();
      resultText.select();
      showStatus("結果を選択しました。手動でコピーしてください。");
    }
  });

  document.getElementById("speakButton").addEventListener("click", () => {
    if (!resultText.value.trim()) {
      showStatus("読み上げる翻訳結果がありません。", true);
      return;
    }
    if (!("speechSynthesis" in window)) {
      showStatus("このブラウザーは読み上げに対応していません。", true);
      return;
    }
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(resultText.value);
    utterance.lang = targetCode;
    speechSynthesis.speak(utterance);
    showStatus("読み上げを開始しました。");
  });

  document.getElementById("stopButton").addEventListener("click", () => {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    showStatus("読み上げを停止しました。");
  });
</script>
</body>
</html>
